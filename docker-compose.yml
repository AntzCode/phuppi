# docker-compose.yml
#
# Docker Compose configuration for the Phuppi application and the Garage S3-compatible dev storage.
#
# @package Phuppi
# @author Anthony Gallon
# @copyright AntzCode Ltd
# @license GPLv3
# @link https://github.com/AntzCode/phuppi/
# @since 2.0.0

services:
  phuppi:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    environment:
      S3_DEV_ENDPOINT: ${S3_DEV_ENDPOINT:-http://garage:3900}
      S3_DEV_ACCESS_KEY: ${S3_DEV_ACCESS_KEY:-GKa1b2c3d4e5f6a7b8c9d0e1f2}
      S3_DEV_SECRET_KEY: ${S3_DEV_SECRET_KEY:-6f0e4b1c9d2a7385e1f4c6b0a93d7e28b5c1f04a69d3e7820b4c5a1f6e9d3b07}
      S3_DEV_BUCKET: ${S3_DEV_BUCKET:-phuppi-files}
      S3_DEV_PATH_PREFIX: ${S3_DEV_PATH_PREFIX:-data/uploadedFiles}
    ports:
      - "80:80"
    volumes:
      - ./public:/var/www/html
      - ./src:/var/www/src
      - ./data:/var/www/data
      - ./docker/php/php.ini-development:/usr/local/etc/php/php.ini
      - ./docker/php/000-default.conf:/etc/apache2/sites-enabled/000-default.conf
    user: "${UID:-1000}:${GID:-1000}"
    depends_on:
      garage-init:
        condition: service_completed_successfully

  # Garage: S3-compatible dev storage (replaces MinIO, whose images were removed from Docker Hub).
  # The rpc secret and admin token are development-only.
  garage:
    image: dxflrs/garage:v2.4.1
    ports:
      - "3900:3900"
    environment:
      GARAGE_RPC_SECRET: 483d6e7676f649fcc7ca9cbbd7cc4af430b259aec4543e0612c3b3ae4f57652a
      GARAGE_ADMIN_TOKEN: development-only-garage-admin-token
    volumes:
      - ./docker/garage/garage.toml:/etc/garage.toml:ro
      - garage_data:/var/lib/garage
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 2s
      retries: 30

  # Sets up the node role, access key and bucket once Garage is up. Safe to re-run.
  garage-init:
    image: alpine:3.19
    environment:
      GARAGE_ADMIN_URL: http://garage:3903
      GARAGE_S3_URL: http://garage:3900
      GARAGE_ADMIN_TOKEN: development-only-garage-admin-token
      S3_DEV_ACCESS_KEY: ${S3_DEV_ACCESS_KEY:-GKa1b2c3d4e5f6a7b8c9d0e1f2}
      S3_DEV_SECRET_KEY: ${S3_DEV_SECRET_KEY:-6f0e4b1c9d2a7385e1f4c6b0a93d7e28b5c1f04a69d3e7820b4c5a1f6e9d3b07}
      S3_DEV_BUCKET: ${S3_DEV_BUCKET:-phuppi-files}
    volumes:
      - ./docker/garage/init.sh:/init.sh:ro
    entrypoint: ["/bin/sh", "/init.sh"]
    depends_on:
      garage:
        condition: service_healthy

  phpdoc:
    image: phpdoc/phpdoc:latest
    profiles:
      - docs
    volumes:
      - .:/data
    working_dir: /data

volumes:
  garage_data: