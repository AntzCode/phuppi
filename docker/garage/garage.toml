# Garage, the S3-compatible dev storage server, as a single node.
# Secrets (GARAGE_RPC_SECRET, GARAGE_ADMIN_TOKEN) come from the environment (docker-compose.yml)
# and are development-only.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"
replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
# Must match the region Phuppi signs requests with (S3Storage defaults to us-east-1)
s3_region = "us-east-1"
api_bind_addr = "[::]:3900"

[admin]
api_bind_addr = "[::]:3903"
